{% extends "base.html" %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">
    <style>.error-container { --error-accent: #f39c12; }</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-code">500</div>
    <div class="error-icon" aria-hidden="true">⚠️</div>
    <h1 class="error-title">Server Error</h1>
    <p class="error-message">
        Something went wrong on our end. We're already on it.<br>
        Please try again in a moment.
    </p>
    <a href="{{ url_for('index') }}" class="error-btn">← Back to Home</a>
</div>
{% endblock %}
